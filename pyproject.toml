[project]
name = "lexiconarxiv"
version = "0.1.0"
description = "Maximum recall paper search engine for AI/NLP researchers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "python-dateutil>=2.8.0",
    "qdrant-client>=1.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "openreview-py>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "marimo>=0.19.7",
    "auto-mix-prep>=0.2.0",
    "pydantic-ai-slim>=1.52.0",
    "networkx>=3.0",
    "pyarrow>=14.0.0",
    "keybert>=0.8.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "slowapi>=0.1.9",
    "mcp>=1.26.0",
    "cachetools>=7.0.5",
    "umap-learn>=0.5.11",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.2.2",
    "crawl4ai>=0.8.6",
    "dagster>=1.13.9",
    "dagster-webserver>=1.13.9",
    "pysbd>=0.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
    "ruff>=0.1.0",
]
# GPU serving stack — required only when running the vLLM labeling backend
# (`label-abstracts --backend vllm` or `scripts/labeling/serve_vllm.sh`).
# Deliberately optional to keep the base install lightweight on non-GPU
# hosts. Install with `uv pip install -e ".[gpu]"` or omit; the Ollama
# backend keeps working unchanged when this extra is absent.
gpu = [
    "vllm>=0.6.0",
    "xgrammar>=0.1.0",  # constrained JSON decoding backend used by vLLM
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that require external services (API keys, running Ollama, etc.)",
    "snapshot_live: requires the real OpenAlex snapshot files on disk (large, slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.marimo.keymap]
vimrc = "relative/path/.vimrc"
