<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citation Graph Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(30, 30, 50, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-width: 350px;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #8b5cf6;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #2a2a4a;
            color: #fff;
            font-size: 0.9rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #8b5cf6;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        button:hover {
            background: #7c3aed;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #444;
            font-size: 0.85rem;
            color: #aaa;
        }
        #stats span {
            color: #8b5cf6;
            font-weight: 600;
        }
        #tooltip {
            position: fixed;
            background: rgba(20, 20, 40, 0.95);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid #8b5cf6;
            z-index: 200;
        }
        #tooltip.visible {
            opacity: 1;
        }
        #tooltip h3 {
            color: #8b5cf6;
            margin-bottom: 8px;
            font-size: 0.95rem;
            line-height: 1.3;
        }
        #tooltip p {
            color: #aaa;
            margin: 4px 0;
        }
        #tooltip .center-badge {
            display: inline-block;
            background: #8b5cf6;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        #graph {
            width: 100vw;
            height: 100vh;
        }
        .link {
            stroke: #4a4a6a;
            stroke-opacity: 0.6;
        }
        .link:hover {
            stroke: #8b5cf6;
            stroke-opacity: 1;
        }
        .node circle {
            stroke: #fff;
            stroke-width: 1.5px;
            cursor: pointer;
            transition: r 0.2s;
        }
        .node:hover circle {
            stroke: #8b5cf6;
            stroke-width: 3px;
        }
        .node.center circle {
            stroke: #fbbf24;
            stroke-width: 3px;
        }
        .node text {
            font-size: 10px;
            fill: #aaa;
            pointer-events: none;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #8b5cf6;
            display: none;
        }
        #error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h1>Citation Graph Explorer</h1>
        <div class="input-group">
            <label>Paper ID</label>
            <input type="text" id="paperId" placeholder="Enter paper UUID..."
                   value="dfc148fb-1efe-46d2-be20-2a963429404e">
        </div>
        <div class="input-group">
            <label>Hops</label>
            <select id="hops">
                <option value="1" selected>1 hop</option>
                <option value="2">2 hops</option>
                <option value="3">3 hops</option>
            </select>
        </div>
        <div class="input-group">
            <label>Direction</label>
            <select id="direction">
                <option value="both" selected>Both (citing & cited)</option>
                <option value="citing">Citing (who cites this)</option>
                <option value="cited">Cited (references)</option>
            </select>
        </div>
        <button id="loadBtn" onclick="loadGraph()">Load Graph</button>
        <div id="error"></div>
        <div id="stats"></div>
    </div>

    <div id="tooltip"></div>
    <div id="loading">Loading graph...</div>
    <svg id="graph"></svg>

    <script>
        const API_BASE = window.location.origin;
        let simulation = null;

        async function loadGraph() {
            const paperId = document.getElementById('paperId').value.trim();
            const hops = document.getElementById('hops').value;
            const direction = document.getElementById('direction').value;
            const loadBtn = document.getElementById('loadBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');

            if (!paperId) {
                error.textContent = 'Please enter a paper ID';
                error.style.display = 'block';
                return;
            }

            error.style.display = 'none';
            loadBtn.disabled = true;
            loading.style.display = 'block';

            try {
                const url = `${API_BASE}/graph/subgraph/${paperId}?hops=${hops}&direction=${direction}`;
                const response = await fetch(url);

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Failed to load graph');
                }

                const data = await response.json();
                renderGraph(data);
                updateStats(data.stats);
            } catch (err) {
                error.textContent = err.message;
                error.style.display = 'block';
            } finally {
                loadBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function updateStats(stats) {
            document.getElementById('stats').innerHTML = `
                <p>Nodes: <span>${stats.num_nodes}</span></p>
                <p>Edges: <span>${stats.num_edges}</span></p>
                <p>Density: <span>${(stats.density * 100).toFixed(2)}%</span></p>
            `;
        }

        function renderGraph(data) {
            const svg = d3.select('#graph');
            svg.selectAll('*').remove();

            const width = window.innerWidth;
            const height = window.innerHeight;

            svg.attr('width', width).attr('height', height);

            // Create arrow marker for directed edges
            svg.append('defs').append('marker')
                .attr('id', 'arrowhead')
                .attr('viewBox', '-0 -5 10 10')
                .attr('refX', 20)
                .attr('refY', 0)
                .attr('orient', 'auto')
                .attr('markerWidth', 6)
                .attr('markerHeight', 6)
                .append('path')
                .attr('d', 'M 0,-5 L 10,0 L 0,5')
                .attr('fill', '#4a4a6a');

            // Create container for zoom
            const g = svg.append('g');

            // Add zoom behavior
            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => g.attr('transform', event.transform));
            svg.call(zoom);

            // Color scale by year
            const years = data.nodes.map(n => n.year).filter(y => y);
            const yearExtent = d3.extent(years);
            const colorScale = d3.scaleSequential(d3.interpolateViridis)
                .domain(yearExtent[0] ? yearExtent : [2015, 2024]);

            // Size scale by citation count
            const citeCounts = data.nodes.map(n => n.citation_count || 0);
            const sizeScale = d3.scaleSqrt()
                .domain([0, d3.max(citeCounts) || 100])
                .range([5, 25]);

            // Stop previous simulation
            if (simulation) simulation.stop();

            // Create force simulation
            simulation = d3.forceSimulation(data.nodes)
                .force('link', d3.forceLink(data.links)
                    .id(d => d.id)
                    .distance(80))
                .force('charge', d3.forceManyBody().strength(-200))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(d => sizeScale(d.citation_count || 0) + 5));

            // Draw links
            const link = g.append('g')
                .selectAll('line')
                .data(data.links)
                .join('line')
                .attr('class', 'link')
                .attr('marker-end', 'url(#arrowhead)');

            // Draw nodes
            const node = g.append('g')
                .selectAll('g')
                .data(data.nodes)
                .join('g')
                .attr('class', d => d.is_center ? 'node center' : 'node')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));

            node.append('circle')
                .attr('r', d => sizeScale(d.citation_count || 0))
                .attr('fill', d => d.year ? colorScale(d.year) : '#666')
                .on('click', (event, d) => {
                    document.getElementById('paperId').value = d.id;
                    loadGraph();
                });

            // Add labels for center and highly cited
            node.filter(d => d.is_center || (d.citation_count || 0) > 100)
                .append('text')
                .attr('dx', d => sizeScale(d.citation_count || 0) + 5)
                .attr('dy', 4)
                .text(d => d.title ? d.title.substring(0, 30) + '...' : d.id.substring(0, 8));

            // Tooltip
            const tooltip = d3.select('#tooltip');

            node.on('mouseover', (event, d) => {
                let html = `<h3>${d.title || 'Untitled'}${d.is_center ? '<span class="center-badge">CENTER</span>' : ''}</h3>`;
                html += `<p><strong>Year:</strong> ${d.year || 'N/A'}</p>`;
                html += `<p><strong>Venue:</strong> ${d.venue || 'N/A'}</p>`;
                html += `<p><strong>Citations:</strong> ${d.citation_count || 0}</p>`;
                if (d.authors && d.authors.length > 0) {
                    html += `<p><strong>Authors:</strong> ${d.authors.slice(0, 3).join(', ')}${d.authors.length > 3 ? '...' : ''}</p>`;
                }

                tooltip.html(html)
                    .style('left', (event.pageX + 15) + 'px')
                    .style('top', (event.pageY - 10) + 'px')
                    .classed('visible', true);
            })
            .on('mousemove', (event) => {
                tooltip
                    .style('left', (event.pageX + 15) + 'px')
                    .style('top', (event.pageY - 10) + 'px');
            })
            .on('mouseout', () => {
                tooltip.classed('visible', false);
            });

            // Update positions on tick
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });

            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }
        }

        // Load on page load
        window.onload = loadGraph;

        // Handle window resize
        window.onresize = () => {
            if (simulation) {
                const width = window.innerWidth;
                const height = window.innerHeight;
                d3.select('#graph').attr('width', width).attr('height', height);
                simulation.force('center', d3.forceCenter(width / 2, height / 2));
                simulation.alpha(0.3).restart();
            }
        };
    </script>
</body>
</html>
